<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앵커링큰연습 a태그</title>
</head>

<body>
    <!--링크(a 태그)에 속성 적용-->
    <a href="https://www.naver.com" target="blank" title="네이버로 이동!">예제 사이트 방문</a>

    <!--이미지(img 태그)에 속성작용-->
    <img src="/img/강아지/강아지1.png" alt="하얀색 비숑 강아지" width="300" height="200">
    <img src="/img/강아지/강압지2.png" alt="닥스훈트" width="300" height="200">
    <!--입력폼(input 태그)에 속성 적용-->
    <form action="submit.php" method="get">
        <label for="username">사용자 이름</label>
        <input type="text" id="username" name="username" placeholder="이름입력" required="required">
        <input type="submit" value="제출">
    </form>
    <!--단락(p 태그)에 속성 적용-->
    <p style="color: blue;font-weight: bold;">이 문장을 파란색 굵은 글씨입니다.</p>
</body>

</html>
